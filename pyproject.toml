[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stormbreaker"
version = "0.1.0"
description = "Per-process battery attribution for Linux, learned per-machine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
stormbreaker = "stormbreaker.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["stormbreaker*"]
